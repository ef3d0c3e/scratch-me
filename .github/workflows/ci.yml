name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR replaces the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Built optimized anyway (see Cargo.toml); no incremental cache in CI
  CARGO_INCREMENTAL: 0

jobs:
  backend:
    name: Backend (fmt, clippy, unit and API tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scratchme
          POSTGRES_PASSWORD: scratchme
          POSTGRES_DB: scratchme_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scratchme"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      # Without it the API tests skip themselves: here they must run
      TEST_DATABASE_URL: postgres://scratchme:scratchme@127.0.0.1:5432/scratchme_test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  frontend:
    name: Frontend (svelte-check, prettier, Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx prettier --check src e2e
      - run: npm run test:unit

  e2e:
    name: Browser flows (Playwright, phone and desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: scratchme
          POSTGRES_PASSWORD: scratchme
          POSTGRES_DB: scratchme
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scratchme"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      # The API (started by Playwright) and the tests' own SQL helpers
      DATABASE_URL: postgres://scratchme:scratchme@127.0.0.1:5432/scratchme
      SCRATCHME_BIND: 127.0.0.1:8081
      SCRATCHME_RELAXED_LIMITS: "1"
      RUST_LOG: warn
      # The production build, not the dev server: timing checks hold on slow runners
      E2E_BUILD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Built before Playwright starts it, so its start-up wait is short
      - run: cargo build -p scratchme-api --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Playwright version
        id: pw
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
