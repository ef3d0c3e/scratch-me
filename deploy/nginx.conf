# Scratch-me behind the host's nginx, next to AnyCardz.
# Copy to /etc/nginx/sites-available/scratchme (or conf.d/scratchme.conf), replace
# scratch.example.org, then: nginx -t && systemctl reload nginx
# Certificates: certbot certonly --webroot -w /var/www/html -d scratch.example.org

# The live feed is a WebSocket under /api/live. Its own variable name: AnyCardz's
# file maps $connection_upgrade, and nginx refuses the same variable twice.
map $http_upgrade $scratchme_upgrade {
    default upgrade;
    ''      close;
}

# API_PORT and WEB_PORT in .env.prod
upstream scratchme_api { server 127.0.0.1:8081; keepalive 16; }
upstream scratchme_web { server 127.0.0.1:3001; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name scratch.example.org;
    # certbot's HTTP challenge, then everything to HTTPS
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name scratch.example.org;

    ssl_certificate     /etc/letsencrypt/live/scratch.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scratch.example.org/privkey.pem;

    # The API takes small JSON bodies only (16 KB)
    client_max_body_size 64k;

    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Every location sets all its headers: nginx drops the server-level
    # proxy_set_header lines in a location that has any of its own, and then
    # a client's own X-Forwarded-For would pass through untouched
    proxy_http_version 1.1;

    location /api/ {
        proxy_pass http://scratchme_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $scratchme_upgrade;
        # The live socket stays open; the API pings it
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Unversioned static files: reused for a week. The app's own chunks are
    # hashed and immutable already.
    location = /favicon.svg {
        proxy_pass http://scratchme_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://scratchme_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
