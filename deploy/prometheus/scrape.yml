# Add to the scrape_configs of the Prometheus that already scrapes AnyCardz.
# The API serves /metrics on SCRATCHME_METRICS_BIND: 127.0.0.1:9101 next to
# AnyCardz (which has 9100), so both stay off the public network.
scrape_configs:
  - job_name: scratchme
    scrape_interval: 30s
    # Same value as SCRATCHME_METRICS_TOKEN; remove when no token is set
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/scratchme.token
    static_configs:
      - targets: ['127.0.0.1:9101']
